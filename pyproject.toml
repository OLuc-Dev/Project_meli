[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capacity-vision-ml"
version = "0.1.0"
description = "MVP para analisar capacidade operacional com dados estruturados de pacotes e pessoas."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Project Meli" }]
license = { text = "MIT" }

[project.scripts]
capacity-vision = "capacity_vision.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
